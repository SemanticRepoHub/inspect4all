<title id="title">Real-world d4py inspection and LLM enrichment</title><desc id="desc">StreamingFlow d4py goes through inspect4all inspect, producing structural JSON, HTML, and embedding export. Optional LLM enrichment reads structural JSON and generates enriched JSON with source and model provenance.</desc>
