<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#55788d" stroke-width="2"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#163247}.h{font-size:25px;font-weight:bold}.l{font-size:17px;font-weight:bold}.s{font-size:13px;fill:#526b78}.b{fill:#edf5fa;stroke:#5b92b3;stroke-width:2}.g{fill:#edf8ef;stroke:#66a67b;stroke-width:2}.a{stroke:#55788d;stroke-width:3;marker-end:url(#a)}</style><text x="550" y="38" text-anchor="middle" class="h">LLM enrichment: originals retained, provenance recorded</text><rect class="b" x="20" y="87" width="235" height="128" rx="12"/><text x="137" y="125" text-anchor="middle" class="l">Analysis JSON</text><text x="137" y="155" text-anchor="middle" class="s">Select missing docstrings</text><text x="137" y="182" text-anchor="middle" class="s">or Java parse gaps</text><path class="a" d="M255 150 H290"/><rect class="b" x="295" y="87" width="230" height="128" rx="12"/><text x="410" y="125" text-anchor="middle" class="l">Limit + cache</text><text x="410" y="155" text-anchor="middle" class="s">--max-records 2</text><text x="410" y="182" text-anchor="middle" class="s">Content-hash caching</text><path class="a" d="M525 150 H560"/><rect class="b" x="565" y="87" width="230" height="128" rx="12"/><text x="680" y="125" text-anchor="middle" class="l">LLM endpoint</text><text x="680" y="155" text-anchor="middle" class="s">OpenAI API key (or local)</text><text x="680" y="182" text-anchor="middle" class="s">Review generated outputs</text><path class="a" d="M795 150 H830"/><rect class="g" x="835" y="87" width="245" height="128" rx="12"/><text x="958" y="125" text-anchor="middle" class="l">Enriched JSON</text><text x="958" y="155" text-anchor="middle" class="s">Provenance metadata</text><text x="958" y="182" text-anchor="middle" class="s">Original JSON unchanged</text></svg>