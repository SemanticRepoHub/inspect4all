# Pre-commit hooks: ruff linting is enforced, mypy type checking is relaxed
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      #- id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter - auto-fixes what it can, blocks commit on remaining issues
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format
