name: Source build and inspection smoke test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  inspect:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: astral-sh/setup-uv@v6
      - name: Build language detector
        run: make libenry
      - name: Install source tool
        run: uv tool install --force .
      - name: Smoke test inspection
        run: |
          uvx --from . inspect4all inspect --all -i examples/hello-world-python -o example_out
          uv run --no-project python -c "import json; from pathlib import Path; p=Path('example_out/repository_analysis.json'); assert p.is_file(); json.loads(p.read_text())"
